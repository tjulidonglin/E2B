[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    lifecycle: sandbox lifecycle tests
    commands: command execution tests
    filesystem: filesystem tests
    pty: PTY tests
    code_interpreter: code interpreter tests
    git: git operation tests
    network: network and port tests
    snapshot: snapshot/pause/resume tests
    volume: volume management tests
    error_handling: error handling tests
    slow: slow running tests
